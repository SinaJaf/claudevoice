[project]
name = "claudevoice"
version = "0.2.0"
description = "Voice for Claude Code: Kokoro speech, local or cloud listening"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "en-core-web-sm",
    "kokoro>=0.9.4",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "numpy>=1.26",
    "preshed==3.0.10",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "spacy>=3.8",
]

[project.scripts]
claudevoice = "claudevoice.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claudevoice"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
